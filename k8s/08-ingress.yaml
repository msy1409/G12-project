apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: g12-ingress
  namespace: enterprise-g12
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: g12.course.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: g12-frontend
                port:
                  number: 80
