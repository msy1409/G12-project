# g12-secret 的「结构示例」，进仓库；真值只在本机 kubectl create secret 时敲
# 这条命令生成真实 Secret（不进仓库、不进截图）：
#   kubectl create secret generic g12-secret -n enterprise-g12 \
#     --from-literal=MYSQL_ROOT_PASSWORD='<自己定，≥12位含大小写数字符号>' \
#     --from-literal=DB_PASSWORD='<与上一行相同>' \
#     --from-literal=JWT_SECRET='<32位以上随机串>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: g12-secret
  namespace: enterprise-g12
  labels:
    app: g12-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME
  DB_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
