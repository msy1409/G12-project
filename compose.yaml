# 本地整套编排：mysql + backend + frontend
# 只对外暴露 frontend 的 80 端口，backend/mysql 仅在内部网络可达。
name: g12

services:
  mysql:
    image: mysql:8.0
    container_name: g12-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-ctts_g12}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - g12-mysql-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - g12-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: g12-api:v1
    container_name: g12-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ctts_g12}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-g12-visitor-platform-local-dev-secret-key-2026}
      JWT_EXPIRE_SECONDS: 7200
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - g12-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: g12-web:v1
    container_name: g12-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - g12-net

volumes:
  g12-mysql-data:
    name: g12-mysql-data

networks:
  g12-net:
    name: g12-net
    driver: bridge
